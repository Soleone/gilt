name: check

on:
  push:
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated themes match the palette
        run: python3 scripts/build.py --check
      - name: Contrast report
        run: python3 scripts/build.py --contrast
