# Gilt: cool obsidian, warm parchment, sovereign gold.
# Generated by scripts/build.py from colors.toml and roles.toml, do not edit

[colors]
foreground = "#D8D1C0"
background = "#0D0F12"

cursor_bg = "#F5EBD2"
cursor_fg = "#0D0F12"
cursor_border = "#F5EBD2"

selection_bg = "#342D1B"
selection_fg = "#F5EBD2"

scrollbar_thumb = "#342D1B"
split = "#4F4A3F"

ansi = [
  "#181B20", # black
  "#BC6060", # red (oxblood)
  "#7FA37A", # green (jade)
  "#D4AF37", # yellow (sovereign gold)
  "#6F8FAF", # blue (lapis)
  "#9A7AA0", # magenta (amethyst)
  "#72A5A4", # cyan (verdigris)
  "#D8D1C0", # white (parchment)
]

brights = [
  "#716957", # bright black (dusty taupe)
  "#D47474", # bright red
  "#9DBB8E", # bright green
  "#E7C968", # bright yellow
  "#8FAECC", # bright blue
  "#B596B8", # bright magenta
  "#91C0BD", # bright cyan
  "#F5EBD2", # bright white (ivory)
]

[colors.indexed]
16 = "#C27B48" # copper
17 = "#8A6240" # bronze

[colors.tab_bar]
background = "#090A0C"

[colors.tab_bar.active_tab]
bg_color = "#0D0F12"
fg_color = "#D4AF37"

[colors.tab_bar.inactive_tab]
bg_color = "#090A0C"
fg_color = "#716957"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#181B20"
fg_color = "#E6DECB"

[colors.tab_bar.new_tab]
bg_color = "#090A0C"
fg_color = "#716957"

[colors.tab_bar.new_tab_hover]
bg_color = "#181B20"
fg_color = "#D4AF37"

[metadata]
name = "Gilt"
author = "Soleone"
origin_url = "https://github.com/Soleone/omarchy-gilt-theme"
