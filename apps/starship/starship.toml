# A complete example Starship prompt in Gilt. Copy to ~/.config/starship.toml,
# or take only the palette from gilt-palette.toml.
# Generated by scripts/build.py from colors.toml and roles.toml, do not edit

format = """
$directory$git_branch$git_state$git_status$python$nodejs$golang$rust$lua$cmd_duration
$character"""

palette = "gilt"

[directory]
style = "bold gold"
truncation_length = 3
read_only_style = "oxblood"

[git_branch]
format = "on [$branch]($style) "
style = "copper"

[git_state]
style = "bold warning"

[git_status]
style = "oxblood"

[python]
format = "via [py $version]($style) "
style = "lapis"

[nodejs]
format = "via [node $version]($style) "
style = "jade"

[golang]
format = "via [go $version]($style) "
style = "verdigris"

[rust]
format = "via [rust $version]($style) "
style = "copper"

[lua]
format = "via [lua $version]($style) "
style = "lapis"

[cmd_duration]
format = "took [$duration]($style) "
style = "taupe"

[character]
success_symbol = "[❯](gold)"
error_symbol = "[❯](error)"
vimcmd_symbol = "[❮](jade)"

[palettes.gilt]
obsidian = "#0D0F12"
raised = "#181B20"
parchment = "#D8D1C0"
ivory = "#F5EBD2"
taupe = "#918977"
dusty = "#716957"
gold = "#D4AF37"
bright_gold = "#E7C968"
gold_shadow = "#342D1B"
oxblood = "#BC6060"
copper = "#C27B48"
jade = "#7FA37A"
verdigris = "#72A5A4"
lapis = "#6F8FAF"
amethyst = "#9A7AA0"
bronze = "#8A6240"
error = "#D47474"
warning = "#E7C968"
success = "#9DBB8E"
