# Gilt roles: which palette colour does which job, for every generated app.
# Values name a key in colors.toml or [extra]. Edit, then run: python3 scripts/build.py

# Tones the apps need that colors.toml does not carry.
[extra]
mutedTaupe = "#918977"      # comments; dusty taupe (3.53:1) is too dim for code
jadeSurface = "#1E2A20"     # diff added / success ground
oxbloodSurface = "#2B1C1D"  # diff removed / error ground
split = "#4F4A3F"           # pane splits and inactive borders
champagne = "#F4E6A6"       # brightest gold highlight

# Terminal colours. colors.toml has no black or white, so they are mapped here.
[ansi]
0 = "lighter_background"  # black: raised stone, so black text stays visible
1 = "red"
2 = "green"
3 = "yellow"
4 = "blue"
5 = "magenta"
6 = "cyan"
7 = "foreground"
8 = "muted"               # bright black: dusty taupe
9 = "bright_red"
10 = "bright_green"
11 = "bright_yellow"
12 = "bright_blue"
13 = "bright_magenta"
14 = "bright_cyan"
15 = "bright_foreground"
16 = "orange"             # extended: copper
17 = "brown"              # extended: bronze

[roles]
# Syntax
comment = "mutedTaupe"
keyword = "orange"
function = "bright_foreground"
variable = "blue"
string = "green"
number = "green"
type = "yellow"
operator = "light_foreground"
punctuation = "dark_foreground"

# Interface
cursor = "bright_foreground"
cursor_text = "background"
selection_bg = "selection"
selection_fg = "bright_foreground"

# Text roles must reach the minimum ratio on every surface, unless allowed with a reason.
[contrast]
minimum = 4.5
surfaces = ["background", "lighter_background"]
text = ["comment", "keyword", "function", "variable", "string", "number", "type", "operator", "punctuation"]
terminal = ["ansi1", "ansi2", "ansi3", "ansi4", "ansi5", "ansi6", "ansi7", "ansi8", "ansi9", "ansi10", "ansi11", "ansi12", "ansi13", "ansi14", "ansi15"]
pairs = [["selection_fg", "selection_bg"]]

[contrast.allow]
punctuation = "recedes on purpose, 4.14:1 on background"
ansi8 = "bright black is dim by terminal convention, 3.53:1"
